<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <linearGradient id="gradGround" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="800" fill="url(#gradGround)"/>
  <rect width="1000" height="800" fill="url(#grid)"/>

  <!-- Outer Border & Compass Header -->
  <rect x="20" y="20" width="960" height="760" fill="none" stroke="#cbd5e1" stroke-width="2" rx="16"/>
  
  <!-- Campus Lawn & Green Zones -->
  <rect x="280" y="380" width="180" height="180" rx="20" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="370" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#166534">Central Quad Lawn</text>

  <rect x="580" y="420" width="100" height="120" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="630" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">Green Grove</text>

  <!-- Walkways & Corridors (Visual Blueprint Layout) -->
  <path d="M 150 720 L 360 720 L 720 550" fill="none" stroke="#e2e8f0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 150 720 L 220 500 L 180 320 L 300 140" fill="none" stroke="#e2e8f0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 220 500 L 520 500 L 420 300 L 300 140" fill="none" stroke="#e2e8f0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 420 300 L 680 300" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>
  <path d="M 180 320 L 420 300" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>

  <!-- Building Outlines -->
  <!-- Main Entrance -->
  <g filter="url(#shadow)">
    <rect x="90" y="680" width="120" height="70" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="715" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">MAIN ENTRANCE</text>
    <text x="150" y="735" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Gate &amp; Security</text>
  </g>

  <!-- Parking Zone -->
  <g filter="url(#shadow)">
    <rect x="300" y="680" width="120" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="360" y="715" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">PARKING AREA</text>
    <text x="360" y="735" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Zone P-1</text>
  </g>

  <!-- Block A Admin -->
  <g filter="url(#shadow)">
    <rect x="150" y="460" width="140" height="80" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="220" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#312e81">BLOCK A</text>
    <text x="220" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Administration</text>
  </g>

  <!-- Block B Academic -->
  <g filter="url(#shadow)">
    <rect x="450" y="460" width="140" height="80" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="520" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">BLOCK B</text>
    <text x="520" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Academic Wing</text>
  </g>

  <!-- Library -->
  <g filter="url(#shadow)">
    <rect x="110" y="280" width="140" height="80" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="180" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0369a1">LIBRARY</text>
    <text x="180" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Central Archive</text>
  </g>

  <!-- CS & AI Engineering -->
  <g filter="url(#shadow)">
    <rect x="350" y="260" width="140" height="80" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="420" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#065f46">CS &amp; AI DEPT</text>
    <text x="420" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Turing Hall</text>
  </g>

  <!-- Research Labs -->
  <g filter="url(#shadow)">
    <rect x="610" y="260" width="140" height="80" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="680" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">RESEARCH LABS</text>
    <text x="680" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Robotics &amp; IoT</text>
  </g>

  <!-- Canteen -->
  <g filter="url(#shadow)">
    <rect x="650" y="510" width="140" height="80" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="720" y="548" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#991b1b">FOOD COURT</text>
    <text x="720" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Cafeteria Hub</text>
  </g>

  <!-- Auditorium -->
  <g filter="url(#shadow)">
    <rect x="230" y="100" width="140" height="80" rx="8" fill="#ffffff" stroke="#ec4899" stroke-width="2"/>
    <text x="300" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#9d174d">AUDITORIUM</text>
    <text x="300" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Grand Hall</text>
  </g>

  <!-- Title & Legend -->
  <g>
    <rect x="40" y="40" width="280" height="75" rx="10" fill="#0f172a" opacity="0.9"/>
    <text x="60" y="70" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">CAMPUS BLUEPRINT MAP</text>
    <text x="60" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Interactive Blueprint Mode (Scale: 1px = 1m approx)</text>
    <text x="60" y="106" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">Mode B: Upload custom PNG/JPG or click to navigate</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(900, 90)">
    <circle r="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <path d="M 0 -28 L 7 0 L 0 5 L -7 0 Z" fill="#ef4444"/>
    <path d="M 0 28 L 7 0 L 0 -5 L -7 0 Z" fill="#64748b"/>
    <text x="0" y="-32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ef4444">N</text>
    <text x="0" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">S</text>
    <text x="36" y="4" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">E</text>
    <text x="-36" y="4" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">W</text>
  </g>
</svg>
